name: CI

# The repo's own gate: `AGENTS.md` says a merge to `main` happens only behind a
# green `npm test` + `npm run build`, and the Orchestrator runs it after every
# task merge. In CI it runs on the merged tree too, so a push to `main` that
# slipped through the local ritual is caught here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only on purpose: only the cycle's closing job is allowed to write (`main`).
permissions:
  contents: read

jobs:
  gate:
    # Pinned on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test (Vitest, headless)
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      - name: Build (tsc --noEmit && vite build)
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          # GitHub paints its own test panel from the log; this adds the one thing it
          # cannot know here: which commit and which batch this gate is covering.
          set -uo pipefail
          out="$GITHUB_STEP_SUMMARY"
          subject=$(git log -1 --format=%s)
          tests=$(grep -aoE '[0-9]+ passed \([0-9]+\)' /tmp/test.log 2>/dev/null | tail -1 || true)
          if [ "${TEST_OUTCOME:-unknown}" = success ] && [ "${BUILD_OUTCOME:-unknown}" = success ]; then
            emoji='✅'
          else
            emoji='🛑'
          fi
          {
            echo "# $emoji CI gate on \`$(git rev-parse --short HEAD)\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | $subject |"
            echo "| Test | ${TEST_OUTCOME:-unknown}${tests:+ · $tests} |"
            echo "| Build | ${BUILD_OUTCOME:-unknown} |"
          } >> "$out"
