name: agent / role smoke

# Second CI increment, and the one that de-risks the whole cycle: it measures the
# four things the credential probe could not.
#
#   1. An agent *with a role* starts headless (`--agent dev`), which needs the role
#      to be usable as a primary agent (`mode: all`).
#   2. The role's own prompt actually loads: the agent is asked to quote the first
#      line of its instructions, and the log is grepped for it.
#   3. `--auto` lets it use tools unattended — it edits one scratch file and runs
#      `npm test` on its own — instead of stopping to ask for permission.
#   4. The job can push a branch with `GITHUB_TOKEN`, and can clone the private
#      asset store with the read-only deploy key at the pinned `ASSETS_COMMIT`.
#
# The nested-agent probe runs `continue-on-error`: whether the orchestrator may
# launch subagents headlessly is a design question, not a blocker for the cycle.
#
# Dispatch only. It writes one dated branch (`smoke/role-probe-<run>`) and deletes
# it again at the end, so nothing accumulates.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model used for the probes
        default: opencode-go/deepseek-v4.1-flash
        required: true

concurrency:
  group: agent-role-smoke
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  role-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install -g @opencode/cli

      - name: The private asset store is readable with the deploy key
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
          ASSETS_REPO: ${{ vars.ASSETS_REPO }}
          ASSETS_COMMIT: ${{ vars.ASSETS_COMMIT }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/assets"
          mkdir -p "$root" && chmod 700 "$root"
          printf '%s\n' "$ASSETS_DEPLOY_KEY" > "$root/key" && chmod 600 "$root/key"
          export GIT_SSH_COMMAND="ssh -i $root/key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 "git@github.com:${ASSETS_REPO}.git" "$root/store"
          git -C "$root/store" fetch --quiet --depth 1 origin "$ASSETS_COMMIT"
          git -C "$root/store" checkout --quiet "$ASSETS_COMMIT"
          echo "commit de assets: $(git -C "$root/store" rev-parse HEAD)"
          test -f "$root/store/anil/PBS/pokemon_metrics_gmax.txt"
          echo "ASSETS_ROOT=$root/store" >> "$GITHUB_ENV"
          echo "POKEANIL_POKEMON=$root/store/anil/Graphics/Pokemon" >> "$GITHUB_ENV"
          echo "POKEANIL_ITEMS=$root/store/anil/Graphics/Items" >> "$GITHUB_ENV"

      - name: The dev role starts, loads its prompt and uses tools
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -o pipefail
          opencode run --agent dev --auto --model '${{ inputs.model }}' \
            'Do exactly this and nothing else.
             1. Quote the first line of your instructions verbatim.
             2. Create the file SMOKE.md at the repository root containing one line: role smoke OK
             3. Run `npm test` and report its exit code.
             4. Report the list of files you changed.' \
            2>&1 | tee /tmp/role.txt
          grep -q 'TypeScript programmer' /tmp/role.txt
          test -f SMOKE.md

      - name: What the agent left behind
        run: |
          echo "== git status"
          git status --short
          echo "== SMOKE.md"
          cat SMOKE.md

      - name: The job can push a branch
        id: push
        run: |
          set -euo pipefail
          branch="smoke/role-probe-${{ github.run_id }}"
          git config user.name opencode-bot
          git config user.email opencode-bot@users.noreply.github.com
          git switch -c "$branch"
          git add SMOKE.md
          git commit -q -m "smoke: the dev role edits and the gate runs from a runner"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "ramas remotas:"; git ls-remote --heads origin "$branch"

      - name: Can the orchestrator launch a subagent headlessly
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode run --agent orchestrator --auto --model '${{ inputs.model }}' \
            'Lanza el subagente `dev` con esta única instrucción: responde exactamente SUBAGENTE OK.
             No hagas nada más, ni planees, ni cortes lotes. Solo eso.' \
            2>&1 | tee /tmp/nested.txt
          grep -qi 'SUBAGENTE OK' /tmp/nested.txt

      - name: Clean up the probe branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n '${{ steps.push.outputs.branch }}' ]; then
            git push origin --delete '${{ steps.push.outputs.branch }}'
          fi
