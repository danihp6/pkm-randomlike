name: agent / autopilot

# The loop. This workflow spends nothing on tokens: it only decides whether a cycle
# may start, and dispatches one. Running the decision on a schedule instead of
# chaining cycles from inside the cycle means a dead cycle, a cancelled run or a
# crashed runner cannot end the loop — and that the human's brake is read at a
# boundary, never in the middle of a merge.
#
# The brake is the repository variable `AUTOPILOT`: anything other than `on` stops
# the loop (it ships as `off`). Setting it is a two-click change in the repo's
# settings, and it takes effect at the next boundary, so no cycle is ever cut in
# half. A blocked or red task does NOT stop the loop by itself: the cycle marks it
# `[!]` in `TODO.md` and takes the next candidate.
#
# The loop is bounded by the backlog and the brake, nothing else: with no open `[ ]`
# left it parks itself, and `agent / autopilot window` is what bounds a day when a
# human wants one. The two stops that remain are three red cycles in a row (something
# is broken; carrying on would only bill minutes for garbage) and the in-flight check.
#
# The brake can also be a **timed window**: `agent / autopilot window` writes a range
# into `AUTOPILOT_FROM` / `AUTOPILOT_UNTIL` (UTC ISO instants) and turns the brake on
# and off on its own edges. This gate reads that range as a belt: a stale `on` or a
# cron that fires late can never start a cycle outside it, and with no range set the
# brake is manual, exactly as before.

on:
  schedule:
    # Every 30 minutes. GitHub's shortest cron interval is 5 minutes, and a busy
    # cluster can delay a scheduled run; the concurrency group below is what keeps
    # two cycles from overlapping.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      ignore_run:
        description: Cycle run handing the baton over (it is in flight, but it is the caller)
        required: false
        default: ''

concurrency:
  group: agent-autopilot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Should a cycle start?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARK_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
          AUTOPILOT: ${{ vars.AUTOPILOT }}
          # The timed window's range, if one is armed. Both are absolute UTC instants,
          # so the reading never depends on which day a recurring `HH:MM` meant.
          WINDOW_FROM: ${{ vars.AUTOPILOT_FROM }}
          WINDOW_UNTIL: ${{ vars.AUTOPILOT_UNTIL }}
          PARKED_UNTIL: ${{ vars.PARKED_UNTIL }}
          PARKED_SHA: ${{ vars.PARKED_SHA }}
          IGNORE_RUN: ${{ inputs.ignore_run }}
        run: |
          set -euo pipefail
          go() { echo "go=$1" >> "$GITHUB_OUTPUT"; echo "REASON=$2" >> "$GITHUB_ENV"; echo "$2"; }
          red() {
            same=$(gh issue list --label agent-blocked --state open --limit 100 --json title \
              --jq --arg t "$1" '[.[] | select(.title == $t)] | length' 2>/dev/null || echo 0)
            if [ "${same:-0}" -gt 0 ]; then
              echo "An open issue already carries '$1': not opening another."
              return 0
            fi
            gh issue create --label agent-blocked --title "$1" --body "$2" || true
          }
          put_var() {
            [ -n "${PARK_TOKEN:-}" ] || return 0
            GH_TOKEN="$PARK_TOKEN" gh variable set "$1" --body "$2" >/dev/null || true
          }
          drop_var() {
            [ -n "${PARK_TOKEN:-}" ] || return 0
            GH_TOKEN="$PARK_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/variables/$1" >/dev/null 2>&1 || return 0
            GH_TOKEN="$PARK_TOKEN" gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/variables/$1" >/dev/null 2>&1 || true
          }
          unpark() {
            drop_var PARKED_UNTIL
            drop_var PARKED_SHA
          }

          if [ "${AUTOPILOT:-}" != "on" ]; then
            go false "AUTOPILOT is '${AUTOPILOT:-unset}': the loop stays parked."
            exit 0
          fi

          # The belt under the window: `agent / autopilot window` owns the brake, and it
          # is turned off on the range's own edge, but a cron that fires late or a run
          # that hand-shakes across the boundary must not start a cycle outside the
          # range either. No range set means the brake is purely manual.
          if [ -n "${WINDOW_UNTIL:-}" ]; then
            now_epoch=$(date -u +%s)
            until_epoch=$(date -u -d "$WINDOW_UNTIL" +%s 2>/dev/null || echo '')
            if [ -n "$until_epoch" ] && [ "$now_epoch" -ge "$until_epoch" ]; then
              go false "The window ended at $WINDOW_UNTIL: the loop stays parked until a range is armed again."
              exit 0
            fi
            from_epoch=$(date -u -d "${WINDOW_FROM:-}" +%s 2>/dev/null || echo '')
            if [ -n "$from_epoch" ] && [ "$now_epoch" -lt "$from_epoch" ]; then
              go false "The window opens at $WINDOW_FROM: the loop is parked until then."
              exit 0
            fi
          fi

          open_tasks=$(grep -cE '^[[:space:]]*-[[:space:]]*\[ \][[:space:]]*\*\*\[Task-' TODO.md || true)
          blocked=$(grep -cE '^[[:space:]]*-[[:space:]]*\[!\][[:space:]]*\*\*\[Task-' TODO.md || true)
          echo "open=$open_tasks blocked=$blocked"
          if [ "$open_tasks" -eq 0 ]; then
            red "Autopilot: nothing left to take" \
                "No open \`[ ]\` task remains in TODO.md ($blocked marked \`[!]\`). The loop is parked until a human frees one or adds work."
            go false "No open task left."
            exit 0
          fi

          inflight=$(gh run list --workflow=agent-cycle.yml --status in_progress --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$inflight" ] && [ "$inflight" != "${IGNORE_RUN:-}" ]; then
            go false "A cycle is already in flight ($inflight)."
            exit 0
          fi

          if [ -n "${PARKED_UNTIL:-}" ] || [ -n "${PARKED_SHA:-}" ]; then
            now_epoch=$(date -u +%s)
            parked_epoch=$(date -u -d "${PARKED_UNTIL:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0)
            head_sha=$(git rev-parse HEAD)
            if [ -n "${PARKED_SHA:-}" ] && [ "$PARKED_SHA" != "$head_sha" ]; then
              echo "Park stamp names ${PARKED_SHA} but main is ${head_sha}: a fix landed, clearing it."
              unpark
            elif [ "$parked_epoch" -le "$now_epoch" ]; then
              echo "Park stamp expired at ${PARKED_UNTIL:-none}: clearing it."
              unpark
            else
              red "Autopilot parked: three red cycles in a row" \
                  "Three consecutive agent / cycle runs had a red verdict on main \`${PARKED_SHA:-unknown}\`. This lifts by itself when a commit lands on main (push the fix) or at ${PARKED_UNTIL}; \`agent / autopilot window\` with \`hours: 0\` clears the stamp now. A manual \`agent / cycle\` run is never gated by it."
              go false "Three red cycles in a row; parked until ${PARKED_UNTIL} or until main moves."
              exit 0
            fi
          fi

          completed=$(gh run list --workflow=agent-cycle.yml --status completed --limit 3 --json conclusion --jq 'length' || echo 0)
          reds=$(gh run list --workflow=agent-cycle.yml --status completed --limit 3 --json conclusion \
            --jq '[.[] | select(.conclusion == "failure")] | length' || echo 0)
          echo "last $completed completed cycles: $reds red"

          if [ "$completed" -ge 3 ] && [ "$reds" -ge 3 ]; then
            tomorrow=$(date -u -d tomorrow +%Y-%m-%d)
            put_var PARKED_UNTIL "${tomorrow}T00:00:00Z"
            put_var PARKED_SHA "$(git rev-parse HEAD)"
            red "Autopilot parked: three red cycles in a row" \
                "The last three agent / cycle runs all had a red verdict, so the loop stopped itself instead of burning the day. It lifts by itself when a commit lands on main (push the fix) or at ${tomorrow}T00:00:00Z, and \`agent / autopilot window\` with \`hours: 0\` clears the stamp immediately."
            go false "Three red cycles in a row."
            exit 0
          fi

          go true "Dispatching a cycle."

      - name: Dispatch a cycle
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run agent-cycle.yml --ref main

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO: ${{ steps.gate.outputs.go }}
          AUTOPILOT_STATE: ${{ vars.AUTOPILOT }}
          WINDOW_FROM: ${{ vars.AUTOPILOT_FROM }}
          WINDOW_UNTIL: ${{ vars.AUTOPILOT_UNTIL }}
          PARKED_UNTIL: ${{ vars.PARKED_UNTIL }}
          PARKED_SHA: ${{ vars.PARKED_SHA }}
        run: |
          # The driver's own summary, so the usual question — "why has nothing run?" —
          # is answered in the runs list instead of in a log.
          set -uo pipefail
          out="$GITHUB_STEP_SUMMARY"
          if [ "${GO:-}" = 'true' ]; then emoji='🚀'; verb='dispatched a cycle'; else emoji='🅿️'; verb='stayed parked'; fi
          {
            echo "# $emoji The loop $verb"
            echo
            if [ -n "${REASON:-}" ]; then echo "**$REASON**"; echo; fi
            echo "| | |"
            echo "| --- | --- |"
            echo "| AUTOPILOT | \`${AUTOPILOT_STATE:-unset}\` |"
            echo "| Window | \`${WINDOW_FROM:-—}\` → \`${WINDOW_UNTIL:-—}\` UTC |"
            echo "| Park stamp | \`${PARKED_UNTIL:-—}\` on \`${PARKED_SHA:-—}\` |"
            echo "| Now | $(date -u '+%Y-%m-%d %H:%M') UTC |"
            echo "| Open tasks | $(grep -cE '^- \[ \] \*\*\[Task-' TODO.md || true) |"
            echo "| Blocked | $(grep -cE '^- \[!\] \*\*\[Task-' TODO.md || true) |"
            echo "| Cycles today | $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/agent-cycle.yml/runs?created=$(date -u +%Y-%m-%d)&per_page=100" --jq '.workflow_runs | length' 2>/dev/null || echo '?') |"
          } >> "$out"
# Re-registered after the repository was recreated (2026-10-20).
