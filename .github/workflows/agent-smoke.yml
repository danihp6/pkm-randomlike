name: agent / smoke

# First CI increment: prove the unknowns of an unattended runner before any cycle
# exists — that `OPENCODE_API_KEY` works, that the CLI runs headless on a clean
# machine, and which `opencode-go` models answer through the provider.
#
# Scope note: everything here goes through *OpenCode*, never through the Console
# inference API by hand. Measured on 2026-10-17, that other door answers
# `402 Insufficient account funds` for a paid model and `403 FreeTierError` for a
# free one — the free tier is only served from inside OpenCode, and the raw
# inference API belongs to the service-account flow we do not use. A probe there
# would only raise false alarms about credential state we depend on.

on:
  workflow_dispatch:
    inputs:
      primary:
        description: Model the cycle will fan out with (must answer)
        default: opencode-go/deepseek-v4.1-flash
        required: true
      secondary:
        description: Cheaper candidate worth verifying through the same path
        default: opencode-go/glm-5.3-flash
        required: true

concurrency:
  group: agent-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    # Pinned on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: |
          npm install -g @opencode/cli
          opencode --version

      - name: The provider answers
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          ask() {
            local model="$1" out
            out=$(opencode run --auto --model "${model}" \
              'Reply with exactly OK and nothing else.' 2>&1) || { echo "$out"; return 1; }
            echo "== ${model}"
            echo "$out" | tail -3
            echo "$out" | grep -qi 'ok'
          }
          ask '${{ inputs.primary }}'
          ask '${{ inputs.secondary }}'

      - name: What the key can see
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode models | grep '^opencode-go/' | head -30 || true
# Re-registered after the repository was recreated (2026-10-20).
