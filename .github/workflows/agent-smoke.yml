name: agent / smoke

# First CI increment: prove the three unknowns of an unattended runner before any
# cycle exists — that `OPENCODE_API_KEY` authenticates against the inference API,
# that the CLI runs headless on a clean machine, and that `opencode-go` serves the
# model we plan to fan out with. Dispatch only, read-only, no side effects on the repo.
#
# The probe step is diagnostic and never fails the job: a paid model answering
# `402 Insufficient account funds` is a fact about the key's *workspace* (billing,
# plan, wrong account), not about the runner, and the Console config probe below is
# what tells the two apart. The job's verdict comes from the CLI step alone.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model the cycle will actually use
        default: opencode-go/deepseek-v4.1-flash
        required: true
      free_model:
        description: Free model used only to separate "unfunded" from "broken"
        default: opencode-go/longcat-2.5-preview-free
        required: true

concurrency:
  group: agent-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    # Pinned on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: |
          npm install -g @opencode/cli
          opencode --version

      - name: Probe the inference API (diagnostic, never fails)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          probe() {
            local model="$1" code
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              -X POST 'https://opencode.ai/inference/openai/v1/chat/completions' \
              -H "Authorization: Bearer $OPENCODE_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"model\":\"${model}\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}]}")
            echo "== ${model}: HTTP ${code}"
            head -c 400 /tmp/probe.json; echo
          }
          probe 'deepseek-v4.1-flash'
          probe 'longcat-2.5-preview-free'
          echo "== what the key is bound to"
          curl -sS -H "Authorization: Bearer $OPENCODE_API_KEY" \
            'https://opencode.ai/api/v2/config' | head -c 600; echo

      - name: OpenCode runs headless through the provider
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode run --auto --model '${{ inputs.model }}' \
            'Reply with exactly OK and nothing else.' | tee /tmp/run.txt
          grep -qi 'ok' /tmp/run.txt

      - name: What the key can see
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode models | grep '^opencode-go/' | head -30 || true
