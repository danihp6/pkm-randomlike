name: agent / smoke

# First CI increment: prove the three unknowns of an unattended runner before any
# cycle exists — that `OPENCODE_API_KEY` authenticates against the inference API,
# that the CLI runs headless on a clean machine, and which `opencode-go` model ids
# this key can actually serve. Dispatch only, read-only, no side effects on the repo.
#
# The paid/free probe is deliberate: a paid model answering `402 Insufficient
# account funds` while a free one answers `200` says the key is valid but its
# workspace is unfunded — a different problem from a bad key, and not a runner's.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to try through the provider
        default: opencode-go/deepseek-v4.1-flash
        required: true
      free_model:
        description: Fallback model used to separate "unfunded" from "broken"
        default: opencode-go/longcat-2.5-preview-free
        required: true

concurrency:
  group: agent-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    # Pinned on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: |
          npm install -g @opencode/cli
          opencode --version

      - name: Probe the inference API (paid and free)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          probe() {
            local model="$1" code
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              -X POST 'https://opencode.ai/inference/openai/v1/chat/completions' \
              -H "Authorization: Bearer $OPENCODE_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"model\":\"${model}\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}]}")
            echo "== ${model}: HTTP ${code}"
            head -c 400 /tmp/probe.json; echo
          }
          probe 'deepseek-v4.1-flash'
          probe 'longcat-2.5-preview-free'

      - name: OpenCode runs headless through the provider
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          try_model() {
            local model="$1"
            echo "== opencode run --model ${model}"
            if opencode run --auto --model "${model}" \
                 'Reply with exactly OK and nothing else.' 2>&1 | tee /tmp/run.txt; then
              grep -qi 'ok' /tmp/run.txt
            else
              return 1
            fi
          }
          try_model '${{ inputs.model }}' \
            || try_model '${{ inputs.free_model }}'

      - name: What the key can see
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode models | grep '^opencode-go/' | head -30 || true
