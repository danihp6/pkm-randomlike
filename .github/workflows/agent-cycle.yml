name: agent / cycle

# The autopilot's unit of work, and the only workflow allowed to write `main`: one
# batch, the Orchestrator driving the ritual it already knows — cut, spec, worktree,
# dev, QA, merge --no-ff, bookkeeping, push. Nested subagents were measured working
# headlessly in `agent-role-smoke.yml`, so the roles are used exactly as written.
#
# The batch is NOT named here. The role reads `TODO.md`'s plan and picks the lowest
# pending batch whose dependencies are closed, applying the `*Decision:*` line each
# item carries. A decision that is not written is never invented: the task is
# blocked in an issue and the next candidate is taken.
#
# What the runner has to tell the role, because the local flow took it for granted:
#   * There is no human. The `question` tool would hang the job: a blocking doubt
#     becomes an `agent-blocked` issue instead.
#   * There is no browser. A `[live]` criterion cannot be measured here, so it is
#     never reported as passing: it becomes an `agent-review` issue, which is the
#     `[?]` state of the design, and does not by itself stop the merge.
#   * The asset store is materialised outside the checkout (a private clone), and
#     `AGENTS.md`'s asset rule applies: pass its absolute path, never a junction.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model the whole cycle runs on
        default: opencode-go/deepseek-v4.1-flash
        required: true
      merge:
        description: Merge to main at the end (false stops after QA)
        type: boolean
        default: true

concurrency:
  group: agent-cycle
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # To hand the baton to the driver when the cycle ends: the scheduled cron fires far
  # less often than it asks to, so the loop cannot depend on it alone.
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remember where main and the issue list were
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate | jq -s 'add | length')
          {
            echo "BEFORE_SHA=$(git rev-parse HEAD)"
            echo "BEFORE_ISSUES=$before"
          } >> "$GITHUB_ENV"
          echo "main=$BEFORE_SHA  issues open=$before"

      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm install -g @opencode/cli

      - name: Materialise the asset store outside the checkout
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
          ASSETS_REPO: ${{ vars.ASSETS_REPO }}
          ASSETS_COMMIT: ${{ vars.ASSETS_COMMIT }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/assets"
          mkdir -p "$root" && chmod 700 "$root"
          printf '%s\n' "$ASSETS_DEPLOY_KEY" > "$root/key" && chmod 600 "$root/key"
          export GIT_SSH_COMMAND="ssh -i $root/key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 "git@github.com:${ASSETS_REPO}.git" "$root/store"
          git -C "$root/store" fetch --quiet --depth 1 origin "$ASSETS_COMMIT"
          git -C "$root/store" checkout --quiet "$ASSETS_COMMIT"
          {
            echo "ASSETS_ROOT=$root/store"
            echo "POKEANIL_POKEMON=$root/store/anil/Graphics/Pokemon"
            echo "POKEANIL_ITEMS=$root/store/anil/Graphics/Items"
          } >> "$GITHUB_ENV"
          echo "assets in $root/store at $ASSETS_COMMIT"

      - name: Configure git identity
        run: |
          git config user.name opencode-bot
          git config user.email opencode-bot@users.noreply.github.com

      - name: Run the cycle
        id: agent
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          PROMPT=$(cat <<'PROMPT_EOF'
          Eres el Orchestrator de POKERANDOMLIKE y esto corre DESATENDIDO en un runner de
          GitHub Actions. Lee AGENTS.md entero y tu fichero de rol antes de nada.

             HECHOS DEL ENTORNO (no los descubras a base de fallos):
             - No hay ningún humano. NUNCA uses la herramienta `question`: colgaría el job
               hasta el timeout. Si de verdad te bloqueas, el issue es obligatorio y con
               contenido REAL, nunca un comodín:
                 gh issue create --label agent-blocked --title "Task-<ID>: <el bloqueo en una
                 frase>" --body "<qué intentaste, el error o la contradicción literal que lo
                 impide, y qué decisión humana hace falta>"
               (tienes GH_TOKEN y permiso de escritura sobre issues). Un issue sin ese
               contenido no sirve de nada y cuenta como fallo tuyo.
             - Un criterio [live] solo existe en el juego corriendo, así que **mídelo tú**:
               arranca el servidor de desarrollo y léelo por CDP sobre un Chromium headless
               (la imagen del runner lo trae), prefiriendo leer el canvas
               (`renderer.snapshotArea` + `getImageData`) antes que una captura, y di en tu
               informe con qué método obtuviste cada evidencia. **Un [live] con medida
               objetiva (una igualdad con una función del repo, un conteo, una coordenada,
               un color concreto, un rango) se mide y cuenta como PASS.** Solo el residuo
               subjetivo —"se ve bien", si un tono lee como tal— va a un issue
               `agent-review` con lo que hay que mirar, y ese issue no impide el merge
               mientras los [unit] estén verdes. Lo que NUNCA se negocia: **nada se reporta
               como pass sin haberlo medido.**
             - El árbol de assets ya está materializado FUERA del checkout: su raíz es
               $ASSETS_ROOT, y POKEANIL_POKEMON / POKEANIL_ITEMS ya apuntan dentro de él.
               Aplica la regla de AGENTS.md (Asset trees): pasa siempre la ruta absoluta a
               quien deba leerla; jamás un junction ni un symlink, ni dentro de un worktree.
             - `origin` es alcanzable y tienes permiso de escritura: los push funcionan.
             - El runner es Linux y efímero. No hay nada más en la máquina.

             ELIGE TÚ EL LOTE:
             1. Mira el plan de TODO.md y los *Dependencies:* de cada item abierto, y toma el
                lote pendiente MÁS BAJO, COMPLETO tal y como está cortado en el plan (2-4
                tareas: dentro de un lote nadie comparte paths, así que caben juntas).
             1b. **Rellena el lote.** Un lote de una sola tarea no gasta los demás slots:
                añade tareas de lotes POSTERIORES hasta cuatro, y solo si (a) sus paths son
                disjuntos de la unión de los ya elegidos, (b) no necesita ningún fichero que
                un compañero de lote produzca, y (c) sus propias dependencias ya están
                mergeadas. Los ficheros calientes siguen con un único dueño por lote. El
                corte del plan es el suelo, no el techo: el lote rellenado va en la misma ola
                de devs y de QA.
             2. Cada item que trae una línea *Decision:* lleva la decisión humana YA tomada,
                y ESA DECISIÓN ES LEY: aplícala tal cual. **Que un item NO traiga
                *Decision:* significa que no necesita ninguna** (la auditoría lo determinó):
                procede sin más. Solo te bloqueas si al escribir la spec encuentras una
                contradicción real, y entonces el issue lleva el motivo concreto.
             3. Bloquear una tarea NO para el lote: márcala (punto siguiente) y sigue con las
                demás.
             4. **Bloquear una tarea significa marcarla.** Cambia su casilla en TODO.md de
                `- [ ]` a `- [!]` y añade `BLOCKED: <motivo en una línea>` al final de su
                línea *Decision:*, y empuja ese cambio a main. El conteo del driver es solo
                `- [ ]`, así que una tarea marcada sale de la cola sola y el siguiente ciclo
                no la vuelve a elegir hasta que un humano la suelte.
             5. Si no queda ninguna tarea elegible, **abre un issue `agent-blocked`
                diciéndolo** (con el motivo: dependencias sin cerrar, todo bloqueado, lo que
                sea), escribe el informe final y termina. No toques main. Un ciclo que no
                mueve nada y no abre ningún issue se considera roto y **falla**: el sistema
                vigila exactamente eso, así que no calles un bloqueo.

             CON EL LOTE ELEGIDO, haz el ritual y nada más:
             1. Una spec por tarea del lote en .agent_specs/task-<ID>.md siguiendo
                docs/agent-spec-template.md, con criterios [unit] y, solo si de verdad
                aplican aquí, [live] con su medida.
             2. Un worktree por tarea y un subagente dev por tarea, cada uno con SOLO la ruta
                de su spec. **Lánzalos EN PRIMER PLANO y espera su informe dentro de este
                run.** NUNCA en background: esto es una pasada única, el proceso termina
                cuando tú terminas, y un subagente en background muere con el runner sin
                haber hecho nada. Lo mismo vale para los de QA. Si un agente no puede
                acabar, lo dices en el informe; no lo dejas corriendo.
             3. Valida como manda tu rol: **una Task QA por tarea, en paralelo**, cada una
                desde su propio árbol de integración (su rama sobre la base del lote),
                corriendo el plan de su spec verbatim, las dos gates (`npm test`,
                `npm run build`) y la auditoría de su diff contra sus exclusive paths. Un
                lote de UNA sola tarea colapsa a una única pasada que cubre también la
                integración; con dos o más, añade la ola de integración sobre el árbol
                combinado (auditoría cruzada y ensayo del merge).
             4. Si QA aprueba: **antes de empujar, ponte al día**: `git fetch origin` y
                trae origin/main a tu rama (rebase o merge). Puede que un humano haya
                empujado mientras trabajabas, y un push rechazado tiraría el ciclo entero.
                Después mergea las ramas en main con --no-ff EN ORDEN DE ID, corre las dos
                gates después de CADA merge, tickea cada casilla en TODO.md, archívalas en
                CHANGELOG.md (una entrada por tarea, en inglés, al principio de
                ## Unreleased), commit y push a origin main. Borra los worktrees.
             5. Si QA es roja: NO mergees. Marca la tarea `[!]` en TODO.md con
                `BLOCKED: QA red, issue #<n>`, abre un issue `agent-blocked` con el
                diagnóstico, empuja el cambio de TODO.md a main y termina el informe.

             Merge autorizado en esta ejecución: ${{ inputs.merge }}.
             Si es false, para después de QA y no toques main.

             Termina con el informe corto y en español del rol: qué tarea tomaste y por qué,
             qué se verificó y cómo, qué issues abriste, qué está bloqueado, y el commit
             final de main si lo hubo.
          PROMPT_EOF
          )
          opencode run --agent orchestrator --auto --model '${{ inputs.model }}' "$PROMPT" 2>&1 | tee /tmp/cycle.txt

      - name: What the cycle changed
        if: always()
        run: |
          echo "== main before: $BEFORE_SHA"
          echo "== main now:    $(git rev-parse HEAD)"
          echo "== new commits"
          git log --oneline "$BEFORE_SHA..HEAD" || true
          echo "== files touched"
          git diff --stat "$BEFORE_SHA..HEAD" || true
          echo "== tree state"
          git status --short

      - name: The merged tree still passes the gate
        id: gate
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          npm run build 2>&1 | tee /tmp/build.log

      - name: A cycle that changes nothing is a red cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Measured failure mode: the orchestrator launched a dev subagent in the
          # background, finished its turn, and the runner took the subagent with it — so
          # the cycle "succeeded" in seven minutes having moved nothing, and the baton
          # handed the same no-op to the next cycle. A cycle may end with nothing merged
          # only if it left a trace: a blocked mark, or an issue. Otherwise it failed.
          after=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate | jq -s 'add | length')
          echo "main before=$BEFORE_SHA now=$(git rev-parse HEAD)"
          echo "open issues before=${BEFORE_ISSUES:-?} now=$after"
          if git diff --quiet "$BEFORE_SHA" HEAD && [ "$after" = "${BEFORE_ISSUES:-}" ]; then
            echo "::error::The cycle moved nothing and opened no issue: the work it started did not finish inside this run."
            exit 1
          fi

      - name: Hand the baton to the next cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Measured overnight: a `*/30` cron fired three times in six hours on this
          # private repository, so the loop cannot depend on the schedule. The cycle
          # asks the driver for the next one instead, and tells it to ignore this run —
          # which is still in flight, and would otherwise read as "a cycle is already
          # running". The driver keeps every decision: AUTOPILOT, the backlog, the red
          # streak and the cap.
          gh workflow run agent-autopilot.yml --ref main -f ignore_run=${{ github.run_id }} || true

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          MERGE_INPUT: ${{ inputs.merge }}
        run: |
          # The run's own summary. GitHub renders its own test panel from the log; this
          # is the part it cannot know: which tasks the cycle took, what the gate did,
          # and what a human still has to look at — with a symbol per line so the state
          # reads at a glance from the runs list.
          set -uo pipefail
          out="$GITHUB_STEP_SUMMARY"
          line() { printf '%s\n' "$1" >> "$out"; }

          before=$(git rev-parse "$BEFORE_SHA")
          moved=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          tasks=$(git log --format=%s "$BEFORE_SHA..HEAD" | grep -oE 'task-[0-9]+' | sort -u | sed 's/^task-/Task-/' | paste -sd' ' - || true)
          [ -n "$tasks" ] || tasks='—'
          diff=$(git diff --shortstat "$BEFORE_SHA..HEAD" || true)
          [ -n "$diff" ] || diff='nothing'
          tests=$(grep -aoE '[0-9]+ passed \([0-9]+\)' /tmp/test.log 2>/dev/null | tail -1 || true)
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at 2>/dev/null || echo '')
          review=''
          blocked=''
          if [ -n "$started" ]; then
            review=$(gh issue list --state open --label agent-review --limit 30 \
              --json number,title,url,createdAt \
              --jq ".[] | select(.createdAt >= \"$started\") | \"[#\(.number)](\(.url)) \(.title)\"" || true)
            blocked=$(gh issue list --state open --label agent-blocked --limit 30 \
              --json number,title,url,createdAt \
              --jq ".[] | select(.createdAt >= \"$started\") | \"[#\(.number)](\(.url)) \(.title)\"" || true)
          fi
          open=$(grep -cE '^- \[ \] \*\*\[Task-' TODO.md || true)
          marks=$(grep -cE '^- \[!\] \*\*\[Task-' TODO.md || true)

          if [ "${AGENT_OUTCOME:-unknown}" != success ] || [ "${GATE_OUTCOME:-unknown}" != success ]; then
            emoji='🛑'; title='The cycle failed'
          elif [ "$MERGE_INPUT" != 'true' ]; then
            emoji='⚠️'; title='Stopped after QA (merge disabled)'
          elif [ "$moved" = "$before" ]; then
            emoji='⚠️'; title='Nothing shipped this cycle'
          else
            emoji='✅'; title='Batch shipped'
          fi

          line "# $emoji $title"
          line ""
          line "| | |"
          line "| --- | --- |"
          line "| Tasks | $tasks |"
          line "| main | \`${BEFORE_SHA:0:7}\` → \`$short\` |"
          line "| Gate (post-merge) | ${GATE_OUTCOME:-unknown}${tests:+ · $tests} |"
          line "| Diff | $diff |"
          line "| Backlog | $open open · $marks blocked |"

          if [ -n "$review" ]; then
            line ""
            line "### ⚠️ Parked for your eye"
            line ""
            line "Measured everything it could; these are the subjective residue."
            line ""
            printf '%s\n' "$review" | sed 's/^/- /' >> "$out"
          fi
          if [ -n "$blocked" ]; then
            line ""
            line "### 🛑 Blocked — needs a decision or a fix"
            line ""
            printf '%s\n' "$blocked" | sed 's/^/- /' >> "$out"
          fi

          if [ "${AGENT_OUTCOME:-unknown}" != success ] && [ -f /tmp/cycle.txt ]; then
            line ""
            line "### 🛑 What the cycle said at the end"
            line ""
            line '```'
            tail -n 12 /tmp/cycle.txt | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/`//g' >> "$out"
            line '```'
          fi

          if [ "$moved" != "$before" ]; then
            line ""
            line "<details><summary>Commits</summary>"
            line ""
            git log --format='- `%h` %s' "$BEFORE_SHA..HEAD" >> "$out"
            line ""
            line "</details>"
          fi
